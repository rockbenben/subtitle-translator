# Cross-platform Tauri build with signing, a draft release carrying latest.json,
# and a portable Windows exe.
#
# Secrets required for auto-update: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD if the key
# has one — ours has none). GITHUB_TOKEN is built in. The release is a DRAFT —
# un-draft it to actually roll the update out (releases/latest ignores drafts).
#
# The pushed tag MUST equal package.json version (v3.0.0 <-> "version": "3.0.0"):
# tauri-action expands __VERSION__ from the app version and the portable-exe step
# uploads to v${APP_VERSION}; a mismatch silently breaks the portable upload.
#
# ---- tauri-action v1 (was v0) — what changed for THIS pipeline -----------------------
#  * A draft run will not adopt a published release. With releaseDraft: true the action
#    scans the release list for a DRAFT carrying this tag; on finding a published one it
#    warns and falls through to CREATING a release for the same tag, which GitHub then
#    rejects. Two consequences: re-running a tag you have already un-drafted needs the
#    release deleted first, and the manual path below must not pass a tagName at all.
#  * It rewrites an existing release's name and body only when that release is already
#    PUBLISHED (updating a draft would move its tag and duplicate it). In the normal draft
#    flow the first matrix job creates the draft and the other three only upload into it,
#    so the generated notes are written once, not four times.
#  * macOS `.app.tar.gz` assets now carry the version, like every other bundle.
#  * latest.json download URLs now use the github.com URL instead of the browser one.
#
# Asset names change with this release (releaseAssetNamePattern below):
#   Subtitle.Translator_3.1.1_x64-setup.exe -> SubtitleTranslator_3.1.1_x64_setup.exe
#   Subtitle.Translator_3.1.1_x64_en-US.msi -> SubtitleTranslator_3.1.1_x64.msi
#   Subtitle.Translator_aarch64.app.tar.gz  -> SubtitleTranslator_3.1.1_aarch64.app.tar.gz
#   SubtitleTranslator_3.1.1_portable.exe   -> SubtitleTranslator_3.1.1_x64_portable.exe
# Already-published releases keep their old names and URLs; only new ones change.
#
# NOT enabled, deliberately:
#  * uploadPlainBinary — upstream says to pair it with `--no-bundle` only, and this build
#    has to emit the installers and updater artifacts too. The three manual steps at the
#    bottom stay.
#
# updaterJsonPreferNsis is ENABLED on purpose (input below). 3.1.0/3.1.1 的已发布用户
# 都是用 NSIS setup.exe 装的;默认 false 让 latest.json 的 windows-x86_64 指向
# .msi,MSI 与 NSIS 是两套独立安装布局,自更新喂 MSI 会在机器上留下并列的第二份
# 安装。翻成 true 后更新包就是 NSIS setup,原地升级、单实例,也是 Tauri v2 的方向。
name: Build Desktop App

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]

jobs:
  # 非发布事件的质量闸:tag 推送只跑发布矩阵,其余事件(push 到分支 / PR / 手动)
  # 跑这一道。镜像文件占 src/** 的 92%,上游改坏接口要等打包才发现就太晚
  # (exportDirNative / languagePreference 两个跨仓库契约 check 尤其容易静默失效)。
  quality:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      # cargo test/clippy 要编译整棵 tauri 依赖树,webkit 开发包和发布矩阵同款
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      # next build 的 TS 阶段只盖 app graph,scripts/*.check.ts 这些不在其中
      - name: TypeScript
        run: yarn typecheck

      - name: Cross-repo contract checks
        shell: bash
        run: |
          npx tsx scripts/exportDirNative.check.ts
          npx tsx scripts/languagePreference.check.ts
          npx tsx scripts/localeBoot.check.ts

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # 仓库刻意不跑 rustfmt(Rust 源码统一 2 空格,build.rs 同样),只卡 clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

  publish-tauri:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev wget file

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      # 必须在 yarn update-version 之前:比的是【提交进去的】package.json
      # (workflow 顶部注释里那条 tag MUST equal version 约定,之前没有任何东西钉它)
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$expected'"
            exit 1
          fi

      - name: Install frontend dependencies
        run: |
          yarn update-version
          yarn install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tag push -> create or fill the draft release. Manual run -> build only:
          # with no tagName the action skips every upload (its README's "just build"
          # mode), so testing the pipeline cannot touch a real release.
          tagName: ${{ github.event_name == 'push' && 'v__VERSION__' || '' }}
          releaseName: ${{ github.event_name == 'push' && 'Subtitle Translator v__VERSION__' || '' }}
          # Prepended to GitHub's generated changelog (releaseName still wins for the title).
          releaseBody: "See the assets to download and install."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          # A manual run uploads to no release, so the bundles are only reachable as
          # workflow artifacts. On a tag push the release already carries them.
          uploadWorkflowArtifacts: ${{ github.event_name != 'push' }}
          # Four platforms uploading a dozen assets each; a single flaky upload used to
          # cost a full re-run, which under v1's draft-matching rule is no longer free.
          retryAttempts: 2
          # One naming scheme for every asset. Without this Tauri's own names win, and a
          # productName containing a space comes out dotted (Subtitle Translator ->
          # Subtitle.Translator_3.1.1_x64-setup.exe) while the portable exe below, named
          # from mainBinaryName, does not — three spellings of one app on one page.
          # [ext] is multi-part aware (.app.tar.gz, .msi.sig), and latest.json resolves its
          # download URLs through this same pattern, so the updater follows automatically.
          # [_setup] is what separates the NSIS installer from the portable exe: both .exe.
          # Drop this line to go back to the Tauri CLI's names.
          releaseAssetNamePattern: "[mainBinaryName]_[version]_[arch][_setup][ext]"
          # 已发布用户都是 NSIS 装的,自更新必须继续喂 NSIS setup 而不是 MSI
          # (理由见文件头注释)。
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Portable "green" exe (Windows only): the raw self-contained binary tauri
      # builds anyway. No installer; needs the WebView2 runtime; does NOT self-update.
      #
      # The version comes from the action's appVersion output, which is the version tauri
      # actually built with (tauri.conf.json, written by `yarn update-version`). Reading
      # package.json again here would name the file and pick the upload tag from a
      # different source, so any drift between the two would land the asset on the wrong
      # release instead of failing.
      - name: Stage portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          test -n "$APP_VERSION"
          cp "src-tauri/target/release/SubtitleTranslator.exe" "SubtitleTranslator_${APP_VERSION}_x64_portable.exe"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Upload portable exe as workflow artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portable-windows
          path: SubtitleTranslator_${{ env.APP_VERSION }}_x64_portable.exe
          if-no-files-found: error

      - name: Attach portable exe to the release
        if: matrix.platform == 'windows-latest' && github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${APP_VERSION}" "SubtitleTranslator_${APP_VERSION}_x64_portable.exe" --clobber

      # The pipeline ends in a manual step: the release is a DRAFT and the updater
      # resolves `releases/latest`, which ignores drafts — so nothing reaches users until
      # someone publishes it. Putting the link and that reminder in the run summary beats
      # a note in a file nobody opens at the moment it matters. Skipped on manual runs,
      # which create no release (the output is empty there).
      - name: Link the draft release in the run summary
        if: github.event_name == 'push' && steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        env:
          RELEASE_URL: ${{ steps.tauri.outputs.releaseHtmlUrl }}
          APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          {
            echo "### Draft release v${APP_VERSION}"
            echo
            echo "[Open the draft release]($RELEASE_URL)"
            echo
            echo 'This release is a **draft**. The updater resolves `releases/latest`, which'
            echo 'ignores drafts — publish it or no client will ever be offered this version.'
          } >> "$GITHUB_STEP_SUMMARY"
